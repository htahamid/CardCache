
<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CardCache</title>

    <!-- Apply saved theme before the page renders -->

    <script>
        (function()
        {
            const savedTheme =
                localStorage.getItem("cardcache-theme");

            const systemPrefersLight =
                window.matchMedia(
                    "(prefers-color-scheme: light)"
                ).matches;

            const theme =
                savedTheme ||
                (systemPrefersLight ? "light" : "dark");

            document.documentElement.setAttribute(
                "data-theme",
                theme
            );
        })();
    </script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================================
         HEADER
         ========================================= -->

    <header>

        <div class="header-top">

            <div class="brand">

                <h1>CardCache</h1>

                <p>
                    Build more decks. Buy fewer cards.
                </p>

            </div>


            <!-- Theme Switch -->

            <button
                type="button"
                id="themeToggle"
                class="theme-switch"
                aria-label="Switch to light mode"
                aria-pressed="false"
                title="Switch to light mode"
            >

                <span class="switch-thumb">

                    <svg
                        class="sun-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <circle cx="12" cy="12" r="4"></circle>

                        <path
                            d="M12 2v2m0 16v2
                               M4.93 4.93l1.42 1.42
                               m11.3 11.3 1.42 1.42
                               M2 12h2m16 0h2
                               M4.93 19.07l1.42-1.42
                               M17.66 6.34l1.41-1.41"
                        ></path>
                    </svg>

                    <svg
                        class="moon-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path
                            d="M20.985 12.486A9 9 0 0 1
                               11.514 3.015
                               9 9 0 1 0
                               20.985 12.486Z"
                        ></path>
                    </svg>

                </span>

            </button>

        </div>


        <!-- Navigation -->

        <nav>

            <a href="index.html">
                Collection
            </a>

            <a href="decks.html">
                My Decks
            </a>

            <a href="#">
                Recommendations
            </a>

        </nav>

    </header>


    <!-- =========================================
         DECK PAGE
         ========================================= -->

    <main>

        <section id="deckBuilder">

            <h2>My Decks</h2>

            <p>
                Import an unfinished Commander deck
                and see what you can build using
                cards you already own.
            </p>

            <textarea
                id="deckInput"
                rows="12"
                placeholder="1 Sol Ring&#10;1 Arcane Signet&#10;1 Cultivate"
            ></textarea>

            <button
                type="button"
                id="analyzeDeckButton"
            >
                Analyze Deck
            </button>

            <p id="deckStatus"></p>

            <div id="deckResults"></div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/theme.js"></script>

    <script src="js/supabaseClient.js"></script>

    <script src="js/decks.js"></script>

</body>

</html>
